name: Build iOS IPA

on:
  workflow_dispatch:

env:
  PROJECT_PATH: mplay_mobile

jobs:
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Build IPA (unsigned)
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mplay-ipa-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Done
        run: echo "IPA built! Download from Artifacts." >> $GITHUB_STEP_SUMMARY
