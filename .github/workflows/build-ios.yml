name: Build iOS (iPad)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - profile

env:
  FLUTTER_VERSION: '3.24.x'
  PROJECT_PATH: mplay_mobile

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Build IPA (unsigned)
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mplay-ipa-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Summary
        run: |
          echo "## iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to install on iPad" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Option A — AltStore (Free)**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download [AltServer](https://altstore.io/) on PC/Mac" >> $GITHUB_STEP_SUMMARY
          echo "2. Install AltStore on iPad via USB" >> $GITHUB_STEP_SUMMARY
          echo "3. Download the IPA from Artifacts below" >> $GITHUB_STEP_SUMMARY
          echo "4. Open IPA in AltStore on iPad → installs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Option B — Sideloadly (Free)**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download [Sideloadly](https://sideloadly.io/) on PC" >> $GITHUB_STEP_SUMMARY
          echo "2. Plug iPad via USB, drag IPA into Sideloadly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Install refreshes every 7 days with free Apple ID" >> $GITHUB_STEP_SUMMARY
