name: Build iOS IPA

on:
  workflow_dispatch:

env:
  PROJECT_PATH: mplay_mobile
  APP_NAME: mPlay

jobs:
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Build iOS archive
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          flutter build ios --release --no-codesign

          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr mPlay.ipa Payload
          ls -lh mPlay.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mplay-ipa-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/build/ios/ipa/mPlay.ipa
          retention-days: 14

      - name: Done
        run: |
          echo "## iOS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install on iPad" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the .ipa from **Artifacts** below" >> $GITHUB_STEP_SUMMARY
          echo "2. Install via **AltStore** or **Sideloadly**" >> $GITHUB_STEP_SUMMARY
          echo "   - [AltStore](https://altstore.io/) (PC/Mac)" >> $GITHUB_STEP_SUMMARY
          echo "   - [Sideloadly](https://sideloadly.io/) (PC)" >> $GITHUB_STEP_SUMMARY
          echo "3. Refreshes every 7 days with free Apple ID" >> $GITHUB_STEP_SUMMARY
